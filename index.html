<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Larder</title>
  <meta name="description" content="Track the pantry, build the shopping list, and see what groceries cost.">
  <meta name="theme-color" content="#f7f3e9">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <script>
    // Apply the saved theme before first paint (no flash of the wrong theme).
    try {
      var t = (JSON.parse(localStorage.getItem('larder.v1') || '{}').settings || {}).theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1 class="brand">Larder</h1>
    <button class="icon-btn" id="open-settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-1.7-1L15 3.5h-4L10.7 6a7 7 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.3 2.5h4l.3-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.4zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Sections">
    <button data-tab="pantry"><span class="tab-ico" aria-hidden="true">&#9638;</span>Pantry</button>
    <button data-tab="list"><span class="tab-ico" aria-hidden="true">&#9745;</span>List<span class="badge" id="list-badge" hidden></span></button>
    <button data-tab="scan"><span class="tab-ico" aria-hidden="true">&#9673;</span>Scan</button>
    <button data-tab="spend"><span class="tab-ico" aria-hidden="true">&#9636;</span>Spend</button>
  </nav>

  <dialog id="modal"><form method="dialog" id="modal-body"></form></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
